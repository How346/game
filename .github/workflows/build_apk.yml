name: Build Flutter Release APK

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build & Upload APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'
          # यहाँ से हमने 'cache: gradle' हटा दिया है क्योंकि अभी हमारे पास Gradle फाइलें नहीं हैं

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      # यह स्टेप सर्वर पर आपके लिए android/ और ios/ फोल्डर बना देगा
      - name: Create Missing Flutter Files
        run: flutter create .

      - name: Install Dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: google-snake-game-release
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
