name: Build Android Release APK

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: 🐦 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 🛠️ Generate Platform Files
        run: flutter create .

      - name: 📦 Install Dependencies
        run: flutter pub get

      - name: 🔍 Check for Code Errors (Analyze)
        run: flutter analyze

      - name: 🏗️ Build APK
        run: flutter build apk --release

      - name: 📤 Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: gridsnap-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
